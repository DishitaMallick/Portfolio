<svg xmlns="http://www.w3.org/2000/svg" width="36" height="38" viewBox="0 0 36 38" fill="none" shape-rendering="crispEdges">
  <defs>
    <!-- Dark theme gradient matching site background (#0C0F1A) -->
    <linearGradient id="darkHandBg" x1="0" y1="0" x2="36" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181C2E"/>
      <stop offset="40%" stop-color="#0C0F1A"/>
      <stop offset="100%" stop-color="#131726"/>
    </linearGradient>
  </defs>

  <g>
    <!-- Outer Dark Contour -->
    <path d="
      M 9,0 L 17,0 L 17,9 L 21,9 L 21,11 L 25,11 L 25,13 L 29,13 L 29,27 L 27,27 L 27,35 L 7,35 L 7,27 L 3,27 L 3,17 L 7,17 L 7,13 L 9,13 Z
    " fill="#06080F"/>

    <!-- Theme Soft Purple Inner Outline (#A78BFA) -->
    <path d="
      M 10,1 L 16,1 L 16,10 L 20,10 L 20,12 L 24,12 L 24,14 L 28,14 L 28,26 L 26,26 L 26,34 L 8,34 L 8,26 L 4,26 L 4,18 L 8,18 L 8,14 L 10,14 Z
    " fill="#A78BFA"/>

    <!-- Theme Dark Fill (#0C0F1A) -->
    <path d="
      M 11,3 L 15,3 L 15,12 L 18,12 L 18,14 L 22,14 L 22,16 L 26,16 L 26,24 L 24,24 L 24,32 L 10,32 L 10,24 L 6,24 L 6,20 L 10,20 L 10,12 Z
    " fill="url(#darkHandBg)"/>

    <!-- Wrist Cuff Theme Border Box -->
    <rect x="9" y="28" width="16" height="5" fill="rgba(12,15,26,0.95)" stroke="#A78BFA" stroke-width="1"/>
    <!-- Cuff 3 Vertical Purple Bars -->
    <rect x="13" y="30" width="1.5" height="2" fill="#A78BFA"/>
    <rect x="16" y="30" width="1.5" height="2" fill="#A78BFA"/>
    <rect x="19" y="30" width="1.5" height="2" fill="#A78BFA"/>

    <!-- Subtle Indigo/Pink Circuit Trace -->
    <path d="
      M 13,30 L 13,22 L 8,22 L 8,17 L 13,17 L 13,5
    " stroke="#818CF8" stroke-width="1.2" fill="none"/>
    <rect x="12" y="4" width="2" height="2" fill="#A78BFA"/>
    <rect x="7" y="16" width="2" height="2" fill="#F472B6"/>

    <!-- Subdued Minimal Pixel Stars -->
    <rect x="12" y="5" width="2" height="2" fill="#EEF0F8"/>
    <rect x="19" y="19" width="2" height="2" fill="#EEF0F8"/>
    <rect x="18" y="20" width="4" height="1" fill="#EEF0F8" opacity="0.7"/>
    <rect x="19" y="18" width="1" height="4" fill="#EEF0F8" opacity="0.7"/>

    <rect x="18" y="9" width="1.5" height="1.5" fill="#818CF8"/>
    <rect x="23" y="21" width="1.5" height="1.5" fill="#F472B6"/>
    <rect x="7" y="24" width="1.5" height="1.5" fill="#EEF0F8"/>

    <!-- Finger Knuckle Lines -->
    <rect x="17" y="11" width="3" height="1" fill="rgba(167,139,250,0.3)"/>
    <rect x="21" y="13" width="3" height="1" fill="rgba(167,139,250,0.3)"/>
    <rect x="25" y="15" width="2" height="1" fill="rgba(167,139,250,0.3)"/>
  </g>
</svg>
