<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="darkArrowBg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#292823"/>
      <stop offset="100%" stop-color="#1E1D18"/>
    </linearGradient>
  </defs>

  <g>
    <!-- Outer Dark Contour -->
    <path d="
      M 0,0 L 3,0 L 29,23 L 29,25 L 18,25 L 18,36 L 10,36 L 10,28 L 6,28 L 0,31 Z
    " fill="#14130F"/>

    <!-- Theme Teal Inner Outline (#00698C) -->
    <path d="
      M 1,1 L 3,1 L 27,22 L 17,22 L 17,35 L 11,35 L 11,27 L 6,27 L 1,29 Z
    " fill="#00698C"/>

    <!-- Theme Dark Background Fill (#292823) -->
    <path d="
      M 3,3 L 24,20 L 15,20 L 15,33 L 13,33 L 13,25 L 8,25 L 3,27 Z
    " fill="url(#darkArrowBg)"/>

    <!-- Subtle Accent Circuit Line -->
    <path d="
      M 4,8 L 4,24 L 6,24 L 6,15 L 11,15 L 11,18 L 16,18
    " stroke="#009BD1" stroke-width="1.2" fill="none"/>
    <rect x="15" y="17" width="2" height="2" fill="#D7D7D7"/>
    <rect x="10" y="14" width="2" height="2" fill="#00698C"/>

    <!-- Minimal Pixel Accents -->
    <rect x="16" y="9" width="2" height="2" fill="#D7D7D7"/>
    <rect x="8" y="7" width="2" height="2" fill="#009BD1"/>
    <rect x="19" y="15" width="1.5" height="1.5" fill="#D7D7D7"/>

    <!-- Stem Theme Grip Bars -->
    <rect x="13.5" y="28" width="1" height="3" fill="#00698C"/>
    <rect x="15" y="28" width="1" height="3" fill="#00698C"/>
    <rect x="16.5" y="28" width="1" height="3" fill="#00698C"/>
  </g>
</svg>
